[package]
name = "pexand"
version = "0.1.0"
edition = "2021"
authors = ["Prashanth Krishnamurthy | techformist.com"]
description = "A lightweight text expander for Windows"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rdev = "0.5"
enigo = "0.2"
iced = { version = "0.14", features = ["tokio", "tiny-skia"], default-features = false }
iced_tiny_skia = "0.14"
iced_winit = "0.14"
iced_fonts = "0.1"
global-hotkey = "0.5"
fuzzy-matcher = "0.3"
tray-icon = "0.14"
clipboard-win = "5.0"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rfd = "0.14"
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"          # Optimize for size (z is smaller than 3)
lto = true               # Enable Link Time Optimization for better inlining
codegen-units = 16       # Faster compilation, LTO still optimizes across units
strip = "symbols"        # Strip symbols for smaller binary
panic = "abort"          # Smaller binary, no unwinding
overflow-checks = false  # Disable overflow checks in release
debug-assertions = false # Disable debug assertions

# Faster development builds
[profile.dev]
opt-level = 1            # Some optimization for faster iteration

# Maximum optimization profile (use: cargo build --profile max-opt)
# Only use this for final release builds where every byte/cycle counts
[profile.max-opt]
inherits = "release"
codegen-units = 1        # Maximum optimization, very slow compile
lto = true
opt-level = "z"
