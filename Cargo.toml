[package]
name = "pexand"
version = "0.1.0"
edition = "2021"
authors = ["Prashanth Krishnamurthy | techformist.com"]
description = "A lightweight text expander for Windows"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rdev = "0.5"
enigo = "0.2"
iced = { version = "0.14", features = ["tokio", "tiny-skia"], default-features = false }
iced_tiny_skia = "0.14"
iced_winit = "0.14"
iced_fonts = "0.1"
global-hotkey = "0.5"
fuzzy-matcher = "0.3"
tray-icon = "0.14"
clipboard-win = "5.0"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rfd = "0.14"
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 16   # Better optimization
strip = true        # Strip debug symbols
panic = "abort"     # Smaller binary
